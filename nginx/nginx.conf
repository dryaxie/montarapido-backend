# ╔═══════════════════════════════════════════════════════════╗
# ║          MONTARAPIDO — Nginx Reverse Proxy Config        ║
# ║  Frontend: / → serve HTML estático                       ║
# ║  Backend:  /api → proxy para Node.js:3000               ║
# ╚═══════════════════════════════════════════════════════════╝

# Limite de upload
client_max_body_size 20M;

# Rate limit global
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name montarapido.com.br www.montarapido.com.br localhost;

    # Redirect HTTP → HTTPS em produção (descomente quando tiver SSL)
    # return 301 https://$host$request_uri;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=()" always;

    # ── Frontend (HTML estático) ──────────────────────────────
    root /usr/share/nginx/html;
    index montarapido.html index.html;

    location / {
        try_files $uri $uri/ /montarapido.html;
        
        # Cache de assets estáticos
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend API (proxy reverso) ───────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Remove o /api do path antes de passar (backend já espera /api)
        # proxy_pass http://backend:3000/api/;  # USE ESTA LINHA se quiser remover

        # Esconde erros internos do servidor
        proxy_intercept_errors off;
    }

    # Rate limit específico para auth
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Uploads servidos diretamente ─────────────────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Health check ──────────────────────────────────────────
    location /health {
        proxy_pass http://backend:3000/health;
        access_log off;
    }

    # ── Bloqueia acesso a arquivos sensíveis ──────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|log|sql|bak)$ {
        deny all;
        return 404;
    }
}

