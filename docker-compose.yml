version: '3.9'

# ╔══════════════════════════════════════════════════════════════╗
# ║           MONTARAPIDO — Docker Compose (Produção)           ║
# ║  Sobe: Frontend (Nginx) + Backend (Node) + PostgreSQL       ║
# ║                                                             ║
# ║  Subir:  docker compose up -d --build                      ║
# ║  Parar:  docker compose down                               ║
# ║  Logs:   docker compose logs -f                            ║
# ╚══════════════════════════════════════════════════════════════╝

services:

  # ─── BANCO DE DADOS ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: montarapido_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-montarapido_db}
      POSTGRES_USER:     ${POSTGRES_USER:-montarapido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_super_segura}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"          # remova em produção
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-montarapido} -d ${POSTGRES_DB:-montarapido_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - montarapido_net

  # ─── BACKEND (Node.js + Express) ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: montarapido_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:            production
      PORT:                3000
      DATABASE_URL:        postgresql://${POSTGRES_USER:-montarapido}:${POSTGRES_PASSWORD:-senha_super_segura}@postgres:5432/${POSTGRES_DB:-montarapido_db}?schema=public
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRES_IN:      7d
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL:        ${FRONTEND_URL:-http://localhost}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      WHATSAPP_API_URL:    ${WHATSAPP_API_URL}
      WHATSAPP_TOKEN:      ${WHATSAPP_TOKEN}
      ADMIN_WHATSAPP:      ${ADMIN_WHATSAPP}
      SMTP_HOST:           ${SMTP_HOST}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER}
      SMTP_PASS:           ${SMTP_PASS}
      EMAIL_FROM:          ${EMAIL_FROM:-MontaRapido <noreply@montarapido.com.br>}
      UPLOAD_DIR:          /app/uploads
      MONTADOR_COMMISSION_PERCENT: 75
      PLATFORM_FEE_PERCENT: 25
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - montarapido_net

  # ─── FRONTEND (Nginx serve o HTML) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: montarapido_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"           # SSL via Let's Encrypt (opcional)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt:ro
    networks:
      - montarapido_net

  # ─── MIGRATIONS (roda uma vez e sai) ─────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: montarapido_migrate
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-montarapido}:${POSTGRES_PASSWORD:-senha_super_segura}@postgres:5432/${POSTGRES_DB:-montarapido_db}?schema=public
    networks:
      - montarapido_net
    restart: "no"           # roda e sai

  # ─── PGADMIN (interface visual do banco — dev only) ──────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: montarapido_pgadmin
    profiles: ["dev"]       # só sobe com: docker compose --profile dev up
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@montarapido.com.br
      PGADMIN_DEFAULT_PASSWORD: pgadmin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - montarapido_net

# ─── VOLUMES ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  certbot_data:
    driver: local

# ─── REDES ────────────────────────────────────────────────────
networks:
  montarapido_net:
    driver: bridge
